<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe de catálogo público e inicio de sesión</title>
  <desc id="desc">Vista de escritorio del catálogo con buscador y filtros, junto a la pantalla de acceso del personal.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #20252b; }
    .label { font-size: 15px; }
    .small { font-size: 13px; fill: #56616d; }
    .heading { font-size: 24px; font-weight: 700; }
    .subheading { font-size: 18px; font-weight: 700; }
    .frame { fill: #ffffff; stroke: #293746; stroke-width: 2; }
    .soft { fill: #f4f6f8; stroke: #98a3ad; stroke-width: 1.5; }
    .accent { fill: #dbe9f6; stroke: #315d84; stroke-width: 1.5; }
    .button { fill: #315d84; }
    .button-text { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .status { fill: #e4f3e7; stroke: #4b8056; }
  </style>
  <rect width="1440" height="900" fill="#edf0f3"/>
  <text x="60" y="52" class="heading">Catálogo público e inicio de sesión</text>
  <text x="60" y="78" class="small">Wireframe inicial — Semana 1</text>

  <g transform="translate(60 110)">
    <rect class="frame" x="0" y="0" width="900" height="720" rx="8"/>
    <rect x="0" y="0" width="900" height="62" rx="8" fill="#dfe4e8"/>
    <circle cx="28" cy="31" r="6" fill="#98a3ad"/><circle cx="48" cy="31" r="6" fill="#98a3ad"/><circle cx="68" cy="31" r="6" fill="#98a3ad"/>
    <text x="96" y="37" class="small">biblioteca.colegio.pe</text>
    <rect x="0" y="62" width="900" height="78" fill="#ffffff"/>
    <text x="34" y="108" class="subheading">Biblioteca Quiñones</text>
    <text x="648" y="108" class="label">Catálogo</text>
    <rect class="button" x="752" y="84" width="120" height="38" rx="4"/>
    <text x="775" y="108" class="button-text">Personal</text>
    <line x1="0" y1="140" x2="900" y2="140" stroke="#b7c0c8"/>

    <text x="34" y="188" class="heading">Encuentra un libro</text>
    <rect class="soft" x="34" y="210" width="530" height="48" rx="4"/>
    <text x="52" y="240" class="small">Título o autor</text>
    <rect class="button" x="578" y="210" width="118" height="48" rx="4"/>
    <text x="607" y="240" class="button-text">Buscar</text>

    <text x="34" y="300" class="subheading">Filtros</text>
    <text x="34" y="331" class="small">Nivel académico</text>
    <rect class="soft" x="34" y="342" width="230" height="44" rx="4"/>
    <text x="50" y="369" class="label">Todos los niveles       ▾</text>
    <text x="286" y="331" class="small">Materia</text>
    <rect class="soft" x="286" y="342" width="230" height="44" rx="4"/>
    <text x="302" y="369" class="label">Todas las materias      ▾</text>

    <text x="34" y="435" class="subheading">Resultados</text>
    <g transform="translate(34 458)">
      <rect class="soft" width="832" height="92" rx="5"/>
      <rect x="16" y="16" width="54" height="60" fill="#c8cfd6"/>
      <text x="88" y="39" class="subheading">Don Quijote de la Mancha</text>
      <text x="88" y="64" class="small">Miguel de Cervantes · Literatura · Secundaria</text>
      <rect class="status" x="688" y="26" width="126" height="38" rx="19"/>
      <text x="710" y="51" class="label">2 disponibles</text>
    </g>
    <g transform="translate(34 566)">
      <rect class="soft" width="832" height="92" rx="5"/>
      <rect x="16" y="16" width="54" height="60" fill="#c8cfd6"/>
      <text x="88" y="39" class="subheading">Ciencia para todos</text>
      <text x="88" y="64" class="small">Ana Torres · Ciencia y Tecnología · Primaria</text>
      <rect x="688" y="26" width="126" height="38" rx="19" fill="#fff1c9" stroke="#9b791d"/>
      <text x="727" y="51" class="label">Prestado</text>
    </g>
  </g>

  <g transform="translate(1000 110)">
    <rect class="frame" x="0" y="0" width="380" height="720" rx="8"/>
    <rect x="0" y="0" width="380" height="62" rx="8" fill="#dfe4e8"/>
    <circle cx="28" cy="31" r="6" fill="#98a3ad"/><circle cx="48" cy="31" r="6" fill="#98a3ad"/><circle cx="68" cy="31" r="6" fill="#98a3ad"/>
    <text x="96" y="37" class="small">/login</text>
    <text x="40" y="146" class="heading">Acceso del personal</text>
    <text x="40" y="178" class="small">Solo administradores y asistentes</text>
    <text x="40" y="235" class="label">Usuario</text>
    <rect class="soft" x="40" y="250" width="300" height="48" rx="4"/>
    <text x="56" y="280" class="small">Ingrese su usuario</text>
    <text x="40" y="342" class="label">Contraseña</text>
    <rect class="soft" x="40" y="357" width="300" height="48" rx="4"/>
    <text x="56" y="387" class="small">••••••••••</text>
    <rect class="button" x="40" y="438" width="300" height="50" rx="4"/>
    <text x="145" y="469" class="button-text">Ingresar</text>
    <line x1="40" y1="540" x2="340" y2="540" stroke="#c2c9cf"/>
    <text x="87" y="584" class="label">← Volver al catálogo público</text>
    <text x="40" y="668" class="small">Los permisos se aplican según el rol.</text>
  </g>
</svg>
