<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">Wireframe de devolución y reportes</title>
  <desc id="desc">Vista móvil para confirmar una devolución y vista administrativa de reportes tabulares.</desc>
  <style>
    text { font-family: Arial, sans-serif; fill: #20252b; }
    .label { font-size: 15px; }
    .small { font-size: 13px; fill: #56616d; }
    .heading { font-size: 24px; font-weight: 700; }
    .subheading { font-size: 18px; font-weight: 700; }
    .frame { fill: #ffffff; stroke: #293746; stroke-width: 2; }
    .soft { fill: #f4f6f8; stroke: #98a3ad; stroke-width: 1.5; }
    .button { fill: #315d84; }
    .button-text { fill: #ffffff; font-size: 14px; font-weight: 700; }
    .warning { fill: #fff1c9; stroke: #9b791d; stroke-width: 1.5; }
  </style>
  <rect width="1440" height="900" fill="#edf0f3"/>
  <text x="55" y="50" class="heading">Devolución, préstamos y reportes</text>
  <text x="55" y="76" class="small">Wireframe inicial — estados calculados y reportes tabulares</text>

  <g transform="translate(70 105)">
    <rect class="frame" width="390" height="740" rx="26"/>
    <rect x="135" y="14" width="120" height="8" rx="4" fill="#68747f"/>
    <text x="28" y="66" class="subheading">Confirmar devolución</text>
    <text x="28" y="93" class="small">Código: LIB-004-EJ02</text>
    <rect class="warning" x="28" y="122" width="334" height="76" rx="5"/>
    <text x="44" y="152" class="subheading">Ejemplar prestado</text>
    <text x="44" y="178" class="small">Préstamo activo encontrado</text>
    <text x="28" y="242" class="small">Libro</text>
    <text x="28" y="268" class="label" style="font-weight:700">Historia del Perú</text>
    <line x1="28" y1="286" x2="362" y2="286" stroke="#c2c9cf"/>
    <text x="28" y="326" class="small">Lector</text>
    <text x="28" y="352" class="label">Carla Mendoza</text>
    <text x="28" y="394" class="small">Préstamo</text>
    <text x="28" y="420" class="label">02/09/2026</text>
    <text x="206" y="394" class="small">Fecha límite</text>
    <text x="206" y="420" class="label">09/09/2026</text>
    <rect class="soft" x="28" y="456" width="334" height="86" rx="4"/>
    <text x="44" y="486" class="label" style="font-weight:700">Estado: Activo</text>
    <text x="44" y="514" class="small">La fecha límite es hoy: aún no está vencido.</text>
    <rect class="button" x="28" y="578" width="334" height="52" rx="4"/>
    <text x="112" y="610" class="button-text">Confirmar devolución</text>
    <rect x="28" y="648" width="334" height="44" rx="4" fill="#ffffff" stroke="#315d84" stroke-width="1.5"/>
    <text x="156" y="676" class="label">Cancelar</text>
  </g>

  <g transform="translate(500 105)">
    <rect class="frame" width="870" height="740" rx="8"/>
    <rect x="0" y="0" width="870" height="68" rx="8" fill="#dfe4e8"/>
    <text x="28" y="42" class="heading">Reportes</text>
    <text x="708" y="42" class="small">Rol: admin</text>
    <text x="28" y="112" class="small">Reporte</text>
    <rect class="soft" x="28" y="126" width="250" height="44" rx="4"/>
    <text x="44" y="153" class="label">Préstamos vencidos   ▾</text>
    <text x="302" y="112" class="small">Desde</text>
    <rect class="soft" x="302" y="126" width="170" height="44" rx="4"/>
    <text x="318" y="153" class="label">01/09/2026</text>
    <text x="496" y="112" class="small">Hasta</text>
    <rect class="soft" x="496" y="126" width="170" height="44" rx="4"/>
    <text x="512" y="153" class="label">09/09/2026</text>
    <rect class="button" x="690" y="126" width="152" height="44" rx="4"/>
    <text x="726" y="153" class="button-text">Consultar</text>

    <text x="28" y="222" class="subheading">Préstamos vencidos</text>
    <text x="680" y="222" class="small">Estado calculado al 09/09/2026</text>
    <g transform="translate(28 246)">
      <rect class="soft" width="814" height="268" rx="4"/>
      <rect width="814" height="54" fill="#dfe4e8"/>
      <text x="14" y="33" class="label" style="font-weight:700">Alumno</text>
      <text x="182" y="33" class="label" style="font-weight:700">Nivel / grado</text>
      <text x="350" y="33" class="label" style="font-weight:700">Libro</text>
      <text x="590" y="33" class="label" style="font-weight:700">Límite</text>
      <text x="714" y="33" class="label" style="font-weight:700">Atraso</text>
      <line x1="0" y1="116" x2="814" y2="116" stroke="#b7c0c8"/>
      <line x1="0" y1="178" x2="814" y2="178" stroke="#b7c0c8"/>
      <text x="14" y="87" class="label">Juan Salas</text><text x="182" y="87" class="label">Sec. · 3.º A</text><text x="350" y="87" class="label">Álgebra básica</text><text x="590" y="87" class="label">03/09/2026</text><text x="731" y="87" class="label">6 días</text>
      <text x="14" y="149" class="label">Rosa Díaz</text><text x="182" y="149" class="label">Prim. · 6.º B</text><text x="350" y="149" class="label">Cuentos peruanos</text><text x="590" y="149" class="label">05/09/2026</text><text x="731" y="149" class="label">4 días</text>
      <text x="14" y="211" class="label">Luis Paredes</text><text x="182" y="211" class="label">Sec. · 1.º C</text><text x="350" y="211" class="label">Biología</text><text x="590" y="211" class="label">08/09/2026</text><text x="731" y="211" class="label">1 día</text>
    </g>

    <text x="28" y="562" class="subheading">Vistas disponibles</text>
    <rect class="soft" x="28" y="582" width="186" height="64" rx="4"/><text x="57" y="621" class="label">RPT-01 Inventario</text>
    <rect class="soft" x="228" y="582" width="186" height="64" rx="4"/><text x="246" y="621" class="label">RPT-02 Activos</text>
    <rect class="soft" x="428" y="582" width="186" height="64" rx="4"/><text x="441" y="621" class="label">RPT-03 Vencidos</text>
    <rect class="soft" x="628" y="582" width="214" height="64" rx="4"/><text x="645" y="621" class="label">RPT-04 Historial</text>
    <text x="28" y="696" class="small">Los reportes son tabulares y respetan las columnas mínimas de la v1.0.</text>
  </g>
</svg>
