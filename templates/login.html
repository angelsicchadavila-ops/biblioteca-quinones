{% extends "base.html" %}
{% block title %}Iniciar sesión · Biblioteca Quiñones{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-7 col-lg-5">
    <section class="bg-white border rounded-3 p-4 shadow-sm">
      <h1 class="h3 mb-3">Inicio de sesión</h1>
      <p class="text-secondary">Acceso exclusivo para personal autorizado.</p>
      <form method="post" novalidate>
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="mb-3">
          <label class="form-label" for="username">Usuario</label>
          <input class="form-control" id="username" name="username" maxlength="50" value="{{ username|default('') }}" autocomplete="username" required autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label" for="password">Contraseña</label>
          <input class="form-control" id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Ingresar</button>
      </form>
    </section>
  </div>
</div>
{% endblock %}
